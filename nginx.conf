server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    # Crawler files must not fall through to the SPA shell. Without this,
    # /sitemap.xml answers 200 with the app's index.html — a file that no
    # longer exists still looks present to Google. The sitemap moved to the
    # apex (https://vethubcore.com/sitemap.xml) when the marketing site
    # took over the indexable surface.
    location = /sitemap.xml { return 404; }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpe?g|gif|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
