<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 232" role="img" aria-label="VetHubCore Community"><title>VetHubCore Community</title>
  <!--
    ONE "Co", READ TWICE.
      line 1  |  VetHub + Co + re   = VetHubCore
      the Co  |  Co + mmunity       = Community

    The C carries a HOOF and the o carries a PAW - the two audiences, in the
    two glyphs the two words share. The C is the house mark's own arc and the
    paw is the house mark's own paw, so this reads as the same identity rather
    than a second one.

    "VetHub" ends where the Co begins; "re" and "mmunity" both start where it
    ends. Absolute per-glyph positions would drift the moment the font fell
    back to another grotesque; anchoring holds the join together in any face.
  --><g transform="translate(242,45.8) scale(1.086)"><g fill="none" stroke="#F2A41C" stroke-width="17" stroke-linecap="round"><path d="M 92 34.8 A 44 44 0 1 0 92 85.2"/><circle cx="160" cy="60" r="38"/></g><g fill="#F2A41C"><g transform="translate(56,60)"><ellipse cx="-10.5" cy="0" rx="9.5" ry="19" transform="rotate(-12 -10.5 0)"/><ellipse cx="10.5" cy="0" rx="9.5" ry="19" transform="rotate(12 10.5 0)"/></g><g transform="translate(160,60) scale(0.85) translate(-50,-54)"><ellipse cx="43.5" cy="40" rx="5.2" ry="6"/><ellipse cx="56.5" cy="40" rx="5.2" ry="6"/><ellipse cx="33" cy="48.5" rx="4.8" ry="5.6" transform="rotate(-18 33 48.5)"/><ellipse cx="67" cy="48.5" rx="4.8" ry="5.6" transform="rotate(18 67 48.5)"/><path d="M50 50 C 60 50 68 57 68 64 C 68 72 60 74 50 74 C 40 74 32 72 32 64 C 32 57 40 50 50 50 Z"/></g></g></g><g font-family="'Hanken Grotesk','Inter','Helvetica Neue',Helvetica,Arial,sans-serif" font-weight="800" font-size="64" letter-spacing="-1" fill="#FFFFFF"><text x="239" y="92" text-anchor="end">VetHub</text><text x="473" y="92" text-anchor="start">re</text><text x="473" y="176" text-anchor="start">mmunity</text></g></svg>